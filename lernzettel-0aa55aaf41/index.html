<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Mathe-Lernzettel</title>
  <style>
    :root {
      --ink: #17243b;
      --muted: #52627a;
      --line: #cbd5e1;
      --accent: #155e75;
      --accent-soft: #e3f0f3;
      --bg: #e8edf2;
      --bar: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--ink);
      font: 10.5pt/1.35 "Aptos", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }

    header {
      background: var(--bar);
      border-bottom: 1px solid var(--line);
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 18px;
    }
    .brand { display: flex; flex-direction: column; margin-right: auto; }
    .eyebrow {
      color: var(--accent);
      font-size: 8pt;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .brand h1 { margin: 0; font-size: 15pt; line-height: 1.2; }

    nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
    nav.tabs button {
      font: inherit;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
    }
    nav.tabs button:hover { border-color: var(--accent); }
    nav.tabs button[aria-selected="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      font-weight: 600;
    }

    .version {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 9.5pt;
    }
    .version select {
      font: inherit;
      padding: 5px 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: white;
      color: var(--ink);
    }

    .export {
      font: inherit;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
    }
    .export:hover { background: var(--accent); color: white; }

    .hint {
      flex-basis: 100%;
      margin: 0;
      color: var(--muted);
      font-size: 8.5pt;
    }

    iframe {
      flex: 1;
      width: 100%;
      border: 0;
      background: var(--bg);
    }

    @media (max-width: 640px) {
      .brand { flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="eyebrow">Mathe-Leistungskurs · Vorabi · Rheinland-Pfalz</span>
      <h1>Lernzettel</h1>
    </div>

    <nav class="tabs" role="tablist" aria-label="Themengebiet">
      <button role="tab" data-topic="analysis">Analysis</button>
      <button role="tab" data-topic="stochastik">Stochastik</button>
      <button role="tab" data-topic="geometrie">Analytische Geometrie</button>
    </nav>

    <label class="version">Fassung
      <select id="version">
        <option value="korrigiert" selected>Claude</option>
        <option value="original">Copilot</option>
      </select>
    </label>

    <button class="export" id="export" title="Ausgewähltes Themengebiet als PDF speichern">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      Als PDF exportieren
    </button>

    <p class="hint">Tipp: Im Druckdialog als Ziel „Als PDF sichern“ bzw. „Als PDF speichern“ wählen, Format A4, Ränder „Keine“, Hintergrundgrafiken an. Tasten 1–3 wechseln das Thema.</p>
  </header>

  <iframe id="viewer" title="Lernzettel"></iframe>

  <script>
    var TOPICS = {
      analysis:   { name: "Analysis",              original: "analysis.html",              korrigiert: "analysis-korrigiert.html" },
      stochastik: { name: "Stochastik",            original: "stochastik.html",            korrigiert: "stochastik-korrigiert.html" },
      geometrie:  { name: "Analytische Geometrie", original: "analytische-geometrie.html", korrigiert: "analytische-geometrie-korrigiert.html" }
    };
    var ORDER = ["analysis", "stochastik", "geometrie"];

    var viewer = document.getElementById("viewer");
    var versionSelect = document.getElementById("version");
    var tabs = document.querySelectorAll("nav.tabs button");
    var current = "analysis";

    function fileFor(topic) { return TOPICS[topic][versionSelect.value]; }

    function show(topic) {
      if (!TOPICS[topic]) topic = "analysis";
      current = topic;
      tabs.forEach(function (b) {
        b.setAttribute("aria-selected", b.dataset.topic === topic ? "true" : "false");
      });
      viewer.src = fileFor(topic);
      document.title = "Lernzettel – " + TOPICS[topic].name;
      if (location.hash !== "#" + topic) history.replaceState(null, "", "#" + topic);
    }

    function exportPdf() {
      // 1. Versuch: direkt aus dem Rahmen drucken (klappt z. B. in Safari/Firefox oder über einen lokalen Server).
      try {
        var w = viewer.contentWindow;
        w.document; // wirft bei file:// in Chrome einen Sicherheitsfehler
        w.focus();
        w.print();
        return;
      } catch (e) {}
      // 2. Fallback: Lernzettel in neuem Tab öffnen.
      var file = fileFor(current);
      if (versionSelect.value === "korrigiert") {
        window.open(file + "#print", "_blank"); // startet dort automatisch den Druckdialog
      } else {
        window.open(file, "_blank");
        alert("Die Copilot-Fassung wurde in einem neuen Tab geöffnet. Dort mit ⌘P (Strg+P) drucken und „Als PDF sichern“ wählen.");
      }
    }

    tabs.forEach(function (b) {
      b.addEventListener("click", function () { show(b.dataset.topic); });
    });
    versionSelect.addEventListener("change", function () { show(current); });
    document.getElementById("export").addEventListener("click", exportPdf);
    document.addEventListener("keydown", function (e) {
      if (e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
      var i = ["1", "2", "3"].indexOf(e.key);
      if (i >= 0) show(ORDER[i]);
    });
    window.addEventListener("hashchange", function () { show(location.hash.slice(1)); });

    versionSelect.value = "korrigiert"; // Standard: Claude-Fassung
    show(location.hash.slice(1) || "analysis");
  </script>
</body>
</html>
